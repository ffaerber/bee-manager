name: Docker Image CI

on:
  push:
    branches: ['main']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Test
        # Build the dashboard first: the served artifact affects routing (the
        # root path is the dashboard when present, a status document when not),
        # and CI should exercise what actually ships.
        #
        # typecheck covers BOTH the server and web/. Neither was checked here
        # before, and web/ was not checked anywhere at all: the root tsconfig
        # includes only src/ and test/, and Vite strips types without checking
        # them. Every .tsx shipped unchecked, which is how a reference to an
        # undefined variable reached production and broke the batch page.
        run: |
          bun install
          (cd web && bun install)
          bun run typecheck
          (cd web && bun run build)
          bun test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push only. This runs on the homelab next to the Bee node, not
      # on the swarm, so there is no remote deploy step — pull it there.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          tags: ghcr.io/${{ github.repository_owner }}/swarm-stamp-monitor:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/swarm-stamp-monitor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
